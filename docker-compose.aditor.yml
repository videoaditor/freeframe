# Aditor overrides for aditor-platform (Hetzner FSN, Falkenstein DE).
#
# nginx already owns :80 and :443 on this box for ~16 other vhosts, so the
# upstream Traefik service cannot bind and is disabled via an unactivated
# profile. Ingress is instead: Cloudflare tunnel -> nginx -> these localhost
# ports. nginx does the /api prefix strip that Traefik's middleware did.
services:
  traefik:
    profiles: ["disabled-nginx-owns-80-443"]

  web:
    # Aditor authenticates editors purely by emailed magic code, so the password
    # path is compiled out of the UI. The API side is closed by
    # PASSWORD_LOGIN_ENABLED=false in .env.prod.
    #
    # NEXT_PUBLIC_REVIEW_GATE_URL turns on /handin, the one-route hand-in: the
    # editor pastes a Trello card, uploads once, and gets back the share link to
    # post, with the craft review underneath it. Additive - the existing upload
    # route is untouched, and this is a page an editor may choose. Off wherever
    # this is unset, so only Aditor's own build grows the route. It is the
    # public hostname the editor's browser already talks to, not a credential;
    # the gate authenticates nothing and answers no verdict, which is why it can
    # be compiled into a client bundle at all.
    # Every client delivery goes through a share link now (Alan, CX call
    # 2026-09-10): a Frame.io-shaped page reads as "pick this apart". He EXPECTS
    # that to drive up revision requests - nobody has measured it, and the
    # revision rate is exactly the number that would show whether he is right. NEXT_PUBLIC_SHARE_COMMENTS_COLLAPSED
    # keeps the comment panel closed on load and only reveals it once the asset
    # already has a comment, so a client lands on the delivered work rather than
    # an empty review queue. Off by default upstream; on here because it is
    # Aditor's own delivery behaviour, not a default anyone importing this repo
    # should inherit silently.
    build:
      args:
        NEXT_PUBLIC_PASSWORD_LOGIN_ENABLED: "false"
        # OFF until the editors and the team have been told. Flip to "true" to switch it on -
        # that is the whole change, and it is one line, deliberately.
        #
        # Saskia's standing rule, 2026-09-10: nothing that alters what a person sees goes live
        # before they hear about it. This one alters what a CLIENT sees - the comment panel no
        # longer opens on load - so merging it with the flag on would have shipped a visible
        # change to every client the moment the PR landed.
        NEXT_PUBLIC_SHARE_COMMENTS_COLLAPSED: "false"
        # Auto Review comments through a share link, which made it a "guest" and badged it
        # Client - its notes read as though the customer had written them. This names it as an
        # automation instead. Safe to turn on immediately: it changes a label on comments the
        # tool itself wrote, and nothing a person wrote.
        NEXT_PUBLIC_AUTOMATION_GUEST_EMAILS: "review@aditor.ai"
        NEXT_PUBLIC_REVIEW_GATE_URL: "https://review.aditor.ai"
    ports:
      - "127.0.0.1:3090:3000"

  api:
    # Aditor is one team working across every brand, so per-project membership is
    # bookkeeping rather than a boundary: every editor is meant to reach every
    # project, and a superadmin has to be able to administer projects a colleague
    # created. Set here rather than in .env.prod so the behaviour ships with the
    # code that implements it and cannot drift from what this repo says is true.
    #
    # Safe only while every account belongs to staff. Clients reach FreeFrame
    # through share links as guests and hold no role, so this does not widen what
    # they see - but giving a client a real account would. Sign-in provisions
    # accounts from the people directory, which is what keeps that true.
    #
    # Auto Review may delete comments it wrote ITSELF, and nothing else. It comments
    # through a share link as a guest with no account, so until now it could never
    # take back a note: a superseded or plainly wrong automated comment stayed on a
    # client-facing timeline until a project owner removed it by hand. Only this exact
    # guest address is reachable, and a comment written by a person - one with an
    # author_id - can never be deleted this way whatever this line says.
    #
    # AUTOMATION_SHARE_WEBHOOK_URL gives every new project a standing share link and
    # tells Auto Review it exists, so nobody creates one by hand. No secret is set:
    # the receiving end also accepts a project whose description links a Trello card
    # on one of Aditor's own boards, which an outsider cannot forge and which the
    # review has to find anyway. Setting AUTOMATION_SHARE_WEBHOOK_SECRET in .env.prod
    # still works and is stricter, but nothing waits for it.
    environment:
      - INSTANCE_WIDE_PROJECT_ACCESS=true
      - SHARE_COMMENT_DELETABLE_GUEST_EMAILS=review@aditor.ai
      - AUTOMATION_SHARE_WEBHOOK_URL=https://review.aditor.ai/api/freeframe/project-registered
    ports:
      - "127.0.0.1:3091:8000"

  worker:
    # CAX41 provides 16 vCPU and 32 GB RAM. Two Celery child processes let two
    # videos transcode concurrently, while the container limits reserve four CPU
    # cores and 24 GB RAM for n8n, Teable, databases, and the other shared apps.
    # Keep each FFmpeg process at two threads per rendition; raising that value
    # previously increased scheduler contention without improving throughput.
    environment:
      - TRANSCODING_CONCURRENCY=2
      - FFMPEG_THREADS=2
    cpus: "12.0"
    mem_limit: 8g
